<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>creative harness</title>
<style>
  :root { --bg:#0e0e10; --panel:#17171a; --line:#2a2a2f; --text:#ececf1; --dim:#8b8b95; --accent:#e8ff6a; --bad:#ff6b6b; --good:#6bffb0; --warn:#ffc46b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; }
  header h1 { font-size:15px; margin:0; letter-spacing:.02em; }
  .badge { font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--dim); }
  .badge.mock { color:var(--warn); border-color:var(--warn); }
  .badge.running { color:var(--accent); border-color:var(--accent); }
  .badge.done { color:var(--good); border-color:var(--good); }
  .badge.error { color:var(--bad); border-color:var(--bad); }
  .stats { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; }
  main { display:grid; grid-template-columns:320px 1fr; min-height:calc(100vh - 50px); }
  aside { border-right:1px solid var(--line); padding:16px; display:flex; flex-direction:column; gap:12px; }
  section { padding:16px 20px; border-bottom:1px solid var(--line); }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 12px; font-weight:600; }
  textarea, select, input { width:100%; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; }
  textarea { min-height:160px; resize:vertical; }
  .row { display:flex; gap:8px; align-items:center; }
  .row label { flex:1; font-size:12px; color:var(--dim); }
  .row input[type=number] { width:64px; }
  button { background:var(--accent); color:#111; border:0; border-radius:6px; padding:10px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  .runs { display:flex; flex-direction:column; gap:4px; overflow:auto; }
  .runs a { color:var(--dim); text-decoration:none; font-size:12px; padding:4px 6px; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .runs a:hover, .runs a.active { background:var(--panel); color:var(--text); }
  .empty { color:var(--dim); padding:40px 20px; }
  .hero { display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start; }
  .hero > div { flex:1; min-width:240px; }
  .hero figure { margin:0; }
  .hero img, .hero video { width:260px; border-radius:8px; display:block; border:1px solid var(--line); }
  figcaption { font-size:12px; color:var(--dim); margin-top:6px; }
  .reason { font-size:16px; max-width:520px; }
  .lane { margin-bottom:18px; }
  .lane-head { display:flex; gap:8px; align-items:baseline; margin-bottom:8px; }
  .lane-head b { font-size:14px; }
  .lane-head span { color:var(--dim); font-size:12px; }
  .strip { display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; width:200px; flex:none; overflow:hidden; }
  .card.best { border-color:var(--accent); }
  .card img, .card video { width:100%; aspect-ratio:9/16; object-fit:cover; display:block; background:#000; }
  .card .body { padding:8px; font-size:12px; }
  .score { font-weight:700; font-size:16px; font-variant-numeric:tabular-nums; }
  .chip { display:inline-block; font-size:11px; padding:1px 6px; border-radius:4px; margin:2px 2px 0 0; }
  .chip.slop { background:#3a1717; color:var(--bad); }
  .chip.ok { background:#163323; color:var(--good); }
  .muted { color:var(--dim); }
  .concepts { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
  .concept { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; }
  .concept.eliminated { opacity:.4; }
  .concept.finalist { border-color:#55551f; }
  .concept.winner { border-color:var(--accent); }
  .concept b { display:block; font-size:13px; margin-bottom:4px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td { padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  .chip.warn { background:#3a2f17; color:var(--warn); }
  .vcheck { display:flex; gap:16px; padding:12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:12px; }
  .vcheck.best { border-color:var(--accent); }
  .vcheck .vmedia { flex:none; }
  .vcheck .vmedia img, .vcheck .vmedia video { width:170px; border-radius:6px; display:block; }
  .vcheck .vbody { flex:1; min-width:0; font-size:12px; }
  .vcheck .flagline { margin-top:5px; }
  .spark { width:100%; height:74px; display:block; margin:10px 0 2px; }
  .look { margin-top:12px; }
  .look .frames { display:flex; gap:6px; overflow-x:auto; margin:5px 0 2px; }
  .look figure { margin:0; flex:none; }
  .look img { height:116px; border-radius:4px; display:block; border:1px solid var(--line); }
  .look figure.ctx img { border-style:dashed; }
  .look figcaption { margin-top:2px; font-size:11px; }
  .log { font:12px/1.5 ui-monospace,Menlo,monospace; max-height:320px; overflow:auto; white-space:pre-wrap; color:var(--dim); }
  .log .error { color:var(--bad); }
  .stage { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>creative harness</h1>
  <span id="mode" class="badge">…</span>
  <span id="status" class="badge" hidden></span>
  <span class="stats" id="stats"></span>
</header>
<main>
  <aside>
    <h2>Brief</h2>
    <select id="presets"><option value="">Load a brief…</option></select>
    <textarea id="brief" placeholder="Paste the brief here"></textarea>
    <div class="row"><label>Concepts</label><input id="concepts" type="number" min="2" max="16" /></div>
    <div class="row"><label>Finalists</label><input id="finalists" type="number" min="1" max="6" /></div>
    <div class="row"><label>Revise rounds</label><input id="iters" type="number" min="0" max="6" /></div>
    <div class="row"><label>Tournament</label><select id="tournament" style="width:auto">
      <option value="auto">Auto (round-robin up to 8)</option><option value="round-robin">Round-robin</option><option value="swiss">Swiss</option>
    </select></div>
    <div class="row"><label>Animate winner (video)</label><input id="video" type="checkbox" style="width:auto" /></div>
    <div class="row"><label>Motion-test finalists</label><input id="motionTest" type="number" min="0" max="6" /></div>
    <div class="row"><label>Video attempts <span id="ffmpeg" class="muted"></span></label><input id="videoAttempts" type="number" min="1" max="4" /></div>
    <button id="go">Run harness</button>
    <h2 style="margin-top:12px">Runs</h2>
    <div class="runs" id="runs"></div>
  </aside>
  <div id="view"><div class="empty">Pick a brief and run the harness, or open a past run.</div></div>
</main>
<script>
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))
let current = location.hash.slice(1) || null
let timer = null

async function boot() {
  const health = await fetch('/api/health').then((r) => r.json())
  $('mode').textContent = health.mock ? 'MOCK' : 'live fal'
  $('mode').className = 'badge' + (health.mock ? ' mock' : '')
  $('concepts').value = health.defaults.concepts
  $('finalists').value = health.defaults.finalists
  $('iters').value = health.defaults.maxIters
  $('video').checked = health.defaults.video
  $('videoAttempts').value = health.defaults.videoAttempts
  $('motionTest').value = health.defaults.motionTest
  if (!health.mock && !health.ffmpeg) $('ffmpeg').textContent = '(no ffmpeg: clips will not be checked)'
  $('tournament').value = health.defaults.tournament
  $('tournament').options[0].textContent = `Auto (round-robin up to ${health.defaults.roundRobinMax})`
  const briefs = await fetch('/api/briefs').then((r) => r.json())
  for (const b of briefs) $('presets').insertAdjacentHTML('beforeend', `<option>${esc(b.name)}</option>`)
  $('presets').onchange = () => { const b = briefs.find((x) => x.name === $('presets').value); if (b) $('brief').value = b.text }
  $('go').onclick = start
  await refreshRuns()
  if (current) poll()
}

async function start() {
  const brief = $('brief').value.trim()
  if (!brief) return $('brief').focus()
  $('go').disabled = true
  const res = await fetch('/api/runs', { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify({ brief, options: {
    concepts: +$('concepts').value, finalists: +$('finalists').value, maxIters: +$('iters').value, video: $('video').checked, videoAttempts: +$('videoAttempts').value, motionTest: +$('motionTest').value, tournament: $('tournament').value } }) }).then((r) => r.json())
  $('go').disabled = false
  if (res.id) open(res.id)
}

// gen guards against a stale in-flight poll drawing or rescheduling after you switch runs.
let gen = 0
function open(id) { current = id; location.hash = id; clearTimeout(timer); gen++; poll(gen) }

async function refreshRuns() {
  const runs = await fetch('/api/runs').then((r) => r.json())
  $('runs').innerHTML = runs.map((r) => `<a href="#${r.id}" data-id="${r.id}" class="${r.id === current ? 'active' : ''}">${r.status === 'running' ? '● ' : ''}${esc(r.id)} · ${esc(r.brief.slice(0, 60))}</a>`).join('') || '<span class="muted">none yet</span>'
  for (const a of $('runs').querySelectorAll('a')) a.onclick = (e) => { e.preventDefault(); open(a.dataset.id) }
}

async function poll(g = gen) {
  if (!current || g !== gen) return
  let run
  try {
    run = await fetch('/api/runs/' + current).then((r) => r.ok ? r.json() : null)
  } catch {
    // Server restarting or briefly unreachable: keep trying rather than freezing the view.
    if (g === gen) timer = setTimeout(() => poll(g), 3000)
    return
  }
  if (g !== gen) return
  if (!run) { $('view').innerHTML = '<div class="empty">Run not found.</div>'; return }
  render(run)
  refreshRuns().catch(() => {})
  if (run.status === 'running') timer = setTimeout(() => poll(g), 1200)
}

function media(r) {
  if (!r) return ''
  // Mock mode returns placeholder images even for video, so only use <video> for real clips.
  const isVideo = r.kind === 'video' && !String(r.endpoint).startsWith('mock:')
  return isVideo ? `<video src="${esc(r.url)}" autoplay loop muted playsinline controls></video>` : `<img src="${esc(r.url)}" loading="lazy" />`
}

const LOOKED = { jump: 'the whole frame changed suddenly', pop: 'one area changed for a single frame', fastest: 'fastest movement' }
const sec = (t) => `${Number(t).toFixed(2)}s`

function frames(list, context) {
  const fig = (f, cls, note) => `<figure class="${cls}"><img src="${esc(f.url)}" loading="lazy" /><figcaption class="muted">${sec(f.t)}${note}</figcaption></figure>`
  return `<div class="frames">${list.map((f) => fig(f, '', '')).join('')}${context ? fig(context, 'ctx', ' · whole frame') : ''}</div>`
}

// The motion curve: one value per frame pair, square-root scaled so a cut does not flatten everything else.
function spark(check) {
  const s = check.signals
  if (!s || s.motion.length < 2) return ''
  const W = 600, H = 74, top = 6, base = H - 14
  const max = Math.sqrt(Math.max(...s.motion, 1))
  const x = (pair) => (pair / (s.motion.length - 1)) * W
  const xt = (t) => Math.min(W, (t / s.duration) * W)
  const pts = s.motion.map((v, i) => `${x(i).toFixed(1)},${(base - (Math.sqrt(v) / max) * (base - top)).toFixed(1)}`).join(' ')
  const marks = check.inspections.map((i) => {
    const bad = i.finding && i.finding.kind !== 'motion'
    return `<line x1="${xt(i.t)}" x2="${xt(i.t)}" y1="${top}" y2="${base}" stroke="${bad ? 'var(--bad)' : i.error ? 'var(--warn)' : 'var(--dim)'}" stroke-width="${bad ? 2 : 1}" stroke-dasharray="${bad ? '' : '3 3'}"/>`
  }).join('')
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Pixel change per frame across the clip">
    <rect x="0" y="${top}" width="${xt(1)}" height="${base - top}" fill="#ffffff" opacity=".05"/>
    ${marks}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/></svg>
    <div class="row muted"><span>0s · first second shaded</span><span style="margin-left:auto">${s.duration}s</span></div>`
}

function videoCheck(v, kept, title) {
  const c = v.videoCheck
  const head = `<div class="lane-head"><b>${title ? esc(title) : `Attempt ${v.version}`}</b><span>${kept ? (title ? 'chosen · ' : 'kept · ') : ''}${esc(v.endpoint)}</span></div>`
  const prompt = `${v.changeSummary ? `<div class="muted">↻ ${esc(v.changeSummary)}</div>` : ''}<div class="muted">motion prompt: ${esc(v.prompt)}</div>`
  if (!c) return `<div class="vcheck"><div class="vmedia">${media(v)}</div><div class="vbody">${head}${prompt}<div class="muted">checking…</div></div></div>`
  const s = c.signals
  const verdict = c.verdict === 'pass' ? '<span class="chip ok">pass</span>' : c.verdict === 'retry' ? '<span class="chip slop">retry</span>' : '<span class="chip warn">not fully checked</span>'
  const score = c.score === undefined ? '' : `<span class="score">${c.score}</span><span class="muted">/10${c.flags.length ? ` − ${c.flags.length} flag${c.flags.length > 1 ? 's' : ''}` : ''}</span>`
  let h = `${head}<div class="row" style="justify-content:flex-start">${score} ${verdict}</div>${prompt}`
  h += c.flags.map((f) => `<div class="flagline"><span class="chip slop">${esc(f.flag)}${f.at ? ` · ${sec(f.at)}` : ''}</span> <span class="chip ${f.source === 'measured' ? 'ok' : 'warn'}">${f.source}</span> ${esc(f.evidence)}</div>`).join('')
  h += c.unchecked.map((u) => `<div class="flagline"><span class="chip warn">not checked</span> ${esc(u)}</div>`).join('')
  if (s) {
    h += spark(c)
    h += `<div class="muted">Measured on all ${s.frames} frames (${s.fps}fps): ${Math.round((1 - s.stillShare) * 100)}% of them move · ${s.firstMoveAt === null ? 'no sustained movement' : `movement from ${sec(s.firstMoveAt)}`} · the first second holds ${s.hookRatio}× the movement of the rest</div>`
  }
  if (c.hook) h += `<div class="look"><b>First second</b> <span class="chip ${c.hook.eventStarted ? 'ok' : 'slop'}">${c.hook.eventStarted ? 'an event starts' : 'nothing starts'}</span> ${esc(c.hook.changes)}${frames(c.hook.frames)}</div>`
  for (const i of c.inspections) {
    const f = i.finding
    const chip = !f ? `<span class="chip warn">not checked</span> ${esc(i.error ?? '')}` : `<span class="chip ${f.kind === 'motion' ? 'ok' : 'slop'}">${esc(f.kind === 'fault' ? f.flag || 'fault' : f.kind === 'cut' ? 'cut' : 'real movement')}</span> ${esc(f.changed)} <span class="muted">(${Math.round(f.confidence * 100)}% sure)</span>`
    h += `<div class="look"><b>${sec(i.t)}</b> <span class="muted">${LOOKED[i.kind]}${i.kind === 'fastest' ? '' : `, ${i.ratio}× its neighbours`}${i.zoomed ? ' · zoomed into the area that changed' : ''}</span><br>${chip}${frames(i.frames, i.context)}</div>`
  }
  if (c.drift) h += `<div class="look"><b>Start to end</b> <span class="chip ${c.drift.consistent || !c.drift.changes.length ? 'ok' : 'slop'}">${c.drift.consistent || !c.drift.changes.length ? 'everything stays itself' : 'drift'}</span> ${esc(c.drift.changes.map((d) => d.what).join('; '))}${frames(c.drift.frames)}</div>`
  if (c.action) h += `<div class="look"><b>Whole clip</b> <span class="muted">${esc(c.action.beats.join(' → '))}</span>${frames(c.action.frames)}</div>`
  return `<div class="vcheck ${kept ? 'best' : ''}"><div class="vmedia">${media(v)}</div><div class="vbody">${h}</div></div>`
}

function render(run) {
  const elapsed = Math.round(((run.finishedAt ?? Date.now()) - run.startedAt) / 1000)
  $('status').hidden = false
  $('status').textContent = run.status
  $('status').className = 'badge ' + run.status
  $('stats').textContent = `${elapsed}s · ~$${run.spend.usd.toFixed(3)} · ${run.spend.calls} calls`
  if (!$('brief').value) $('brief').value = run.brief

  const byId = Object.fromEntries(run.concepts.map((c) => [c.id, c]))
  // Concept cards count only concept-round wins; showdown wins are a different contest.
  const wins = {}; for (const m of run.matches) if (m.round.startsWith('Concepts')) wins[m.winner] = (wins[m.winner] ?? 0) + 1
  let html = ''

  if (run.final) {
    const first = run.renders.find((r) => r.conceptId === run.final.conceptId && r.version === 1)
    const c = byId[run.final.conceptId]
    html += `<section><h2>Winner</h2><div class="hero">
      ${first ? `<figure>${media(first)}<figcaption>v1 draft · ${first.critique?.score ?? '–'}/10 <span class="muted">(draft scoring: text and hands not judged)</span></figcaption></figure>` : ''}
      <figure>${media(run.final.video ?? run.final.image)}<figcaption>final · ${run.final.image?.critique?.score ?? '–'}/10 <span class="muted">(full rubric)</span> · ${esc(run.final.image?.endpoint)}</figcaption></figure>
      <div><div class="reason"><b>${esc(c?.title)}</b><br>${esc(c?.hook)}</div><p class="muted">${esc(run.final.reason)}</p></div>
    </div></section>`
  }

  const videos = run.renders.filter((r) => r.kind === 'video' && r.stage !== 'motion-test')
  if (videos.length) {
    html += '<section><h2>Video check: every frame measured, then a closer look where it changed</h2>' + videos.map((v) => videoCheck(v, v.id === run.final?.video?.id)).join('') + '</section>'
  }
  const tests = run.renders.filter((r) => r.stage === 'motion-test')
  if (tests.length) {
    html += '<section><h2>Motion test: a cheap clip of each top finalist, checked before the choice</h2>' + tests.map((v) => videoCheck(v, v.conceptId === run.final?.conceptId, `Motion test · ${byId[v.conceptId]?.title ?? v.conceptId}`)).join('') + '</section>'
  }

  const finalists = run.concepts.filter((c) => c.status === 'finalist' || c.status === 'winner')
  if (finalists.length) {
    html += '<section><h2>Develop: draft → critique → revise</h2>'
    for (const c of finalists) {
      const rs = run.renders.filter((r) => r.conceptId === c.id && r.kind === 'image' && !r.id.endsWith('-final'))
      // Same ranking as the harness (critic.ts effectiveScore): score minus a point per slop flag.
      const eff = (r) => r.critique.score - r.critique.slop.length
      const best = rs.reduce((b, r) => (r.critique && !r.discarded && (!b || eff(r) > eff(b)) ? r : b), null)
      html += `<div class="lane"><div class="lane-head"><b>${esc(c.title)}</b><span>${esc(c.axis)} · ${esc(c.hook)}</span></div><div class="strip">`
      html += rs.map((r) => `<div class="card ${r === best ? 'best' : ''}">${media(r)}<div class="body">
        <div class="row"><span class="score">${r.critique ? r.critique.score : '…'}</span><span class="muted">v${r.version} · ${r.critique?.verdict ?? 'judging'}</span></div>
        ${r.changeSummary ? `<div class="muted">↻ ${esc(r.changeSummary)}</div>` : ''}
        ${(r.critique?.slop ?? []).map((s) => `<span class="chip slop" title="${esc(s.evidence)}">${esc(s.flag)}</span>`).join('')}
        ${r.critique && !r.critique.slop.length ? '<span class="chip ok">no slop</span>' : ''}
        ${(r.critique?.fixes ?? []).length ? `<div class="muted" style="margin-top:4px">fix: ${esc(r.critique.fixes.join('; '))}</div>` : ''}
      </div></div>`).join('') || '<span class="muted">rendering…</span>'
      html += '</div></div>'
    }
    html += '</section>'
  }

  if (run.concepts.length) {
    html += `<section><h2>Diverge: ${run.concepts.length} concepts</h2><div class="concepts">` + run.concepts.map((c) => `<div class="concept ${c.status}">
      <b>${esc(c.title)}</b><div class="muted">${esc(c.axis)} · ${esc(c.medium)} · ${wins[c.id] ?? 0} wins</div><div>${esc(c.hook)}</div></div>`).join('') + '</div></section>'
  }

  if (run.matches.length) {
    html += '<section><h2>Select: pairwise judging (A/B swapped to catch order bias)</h2><table>' + run.matches.map((m) => `<tr>
      <td class="muted">${esc(m.round)}</td><td>${esc(m.a)} vs ${esc(m.b)}</td><td><b>${esc(m.winner)}</b></td>
      <td>${m.consistent ? '<span class="chip ok">consistent</span>' : '<span class="chip slop" title="Swapping A/B changed the verdict, or one pass failed">order-biased</span>'}</td><td class="muted">${esc(m.reason)}</td></tr>`).join('') + '</table></section>'
  }

  html += '<section><h2>Trace</h2><div class="log">' + run.events.map((e) => `<div class="${e.stage === 'error' ? 'error' : ''}">${(e.t / 1000).toFixed(1).padStart(6)}s <span class="stage">${e.stage.padEnd(9)}</span> ${esc(e.message)}</div>`).join('') + '</div></section>'

  // Skip identical redraws so playing videos don't restart; keep scroll positions across redraws.
  if (html === lastHtml) return
  lastHtml = html
  const oldLog = $('view').querySelector('.log')
  const follow = !oldLog || oldLog.scrollHeight - oldLog.scrollTop - oldLog.clientHeight < 20
  const logTop = oldLog?.scrollTop ?? 0
  const strips = [...$('view').querySelectorAll('.strip')].map((s) => s.scrollLeft)
  $('view').innerHTML = html
  const log = $('view').querySelector('.log')
  if (log) log.scrollTop = follow ? log.scrollHeight : logTop
  $('view').querySelectorAll('.strip').forEach((s, i) => { s.scrollLeft = strips[i] ?? 0 })
}
let lastHtml = ''

window.onhashchange = () => { const id = location.hash.slice(1); if (id && id !== current) open(id) }
boot()
</script>
</body>
</html>
